<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="popup.css" />
    <title>酸橙密码</title>
  </head>
  <body>
    <header>
      <img src="icon.png" alt="" />
      <div><strong>酸橙</strong><small>LOCAL / PASSWORDS</small></div>
    </header>
    <p id="site"></p>
    <p id="status" role="status">正在连接本机收藏室…</p>
    <section id="pending" hidden>
      <strong id="pending-label"></strong>
      <p>确认登录或改密成功后保存。</p>
      <select id="pending-account" aria-label="选择要更新的账号"></select>
      <div class="actions">
        <button id="dismiss-save">暂不</button
        ><button id="confirm-save">保存账号</button>
      </div>
    </section>
    <div id="accounts"></div>
    <button id="save-current">保存当前页面账号</button
    ><button id="retry">刷新账号</button>
    <footer>
      当前子站优先 · 记住此登录页上次填写的账号<br />Alt + Shift + L 打开扩展 ·
      不自动提交
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
